[project]
name = "plant-succession-ml"
version = "0.1.0"
description = "Field-data infrastructure for plant succession and disturbance-response monitoring."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "google-api-python-client>=2.160",
  "google-auth>=2.38",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "openai>=2.0",
  "pillow>=11.1",
  "pillow-heif>=0.20",
  "python-multipart>=0.0.18",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
plant-succession-ingest = "plant_succession.app:run"

[tool.setuptools.package-data]
plant_succession = ["web/*"]

[tool.ruff]
line-length = 100

