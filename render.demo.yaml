services:
  - type: web
    name: plant-succession-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_demo.py --reset --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PLANT_DEMO_MODE
        value: "true"
      - key: PLANT_DEMO_READ_ONLY
        value: "true"
