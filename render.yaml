services:
  - type: web
    name: plant-succession-ingest
    runtime: python
    region: virginia
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn plant_succession.app:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PLANT_PUBLIC_DATA
        value: /var/data/public
      - key: PLANT_INGESTION_STATE
        value: /var/data/ingestion
      - key: PLANT_PHOTO_ARCHIVE
        value: /var/data/photos
      - key: PLANT_INGESTION_USERNAME
        value: admin
      - key: PLANT_INGESTION_PASSWORD
        sync: false
    disk:
      name: plant-succession-data
      mountPath: /var/data
      sizeGB: 1
